@let ui = coreUi();

<div class="card-resize-area" (pointerdown)="startResize($event)">
    <div class="card-resize-control"></div>
</div>

<div class="card-header" #header>
    <div class="card-title">
        <h3>{{ data | localize: 'name' }}</h3>
        @if (data.nameVariant) {
            <div class="name-variant">{{ data | localize: 'nameVariant' }}</div>
        }
    </div>
    <button
        matIconButton
        [aria-label]="ui.showOnMap"
        (click)="goToLocation$.next();"
    >
        <mat-icon>my_location</mat-icon>
    </button>
    <button
        matIconButton
        [aria-label]="ui.share"
        (click)="share()"
    >
        <mat-icon class="share-icon">ios_share</mat-icon>
    </button>
    <button
        matIconButton
        [aria-label]="ui.close"
        (click)="close()"
    >
        <mat-icon>close</mat-icon>
    </button>
</div>

<coiaf-subtitle [location]="data" class="card-subtitle" />

<div class="description">{{ data | localize: 'description' }}</div>
