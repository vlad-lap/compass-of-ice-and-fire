<mat-autocomplete
    [displayWith]="displayFn"
    hideSingleSelectionIndicator
>
    @let filtered = filteredOptions() | keyvalue: sortOptionsGroup;
    @let groups = optionGroups();

    @for (optionGroup of filtered; track optionGroup.key) {
        <mat-optgroup [label]="groups[optionGroup.key]">
            @for (option of optionGroup.value | sortSearchOptions: optionGroup.key; track option.id) {
                <mat-option [value]="option">{{ option | localize: 'name' }}</mat-option>
            }
        </mat-optgroup>
    }
</mat-autocomplete>
